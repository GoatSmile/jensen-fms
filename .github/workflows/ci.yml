# Tier 1 CI — the gap Vercel does NOT cover.
#
# Vercel already builds every push on a clean machine, so a broken
# `next build` fails the deploy and prod keeps serving the last good version.
# What it misses is ESLint: Next 16 no longer runs it during `next build`, so
# lint errors reach production unchecked — that is the class that slipped on
# 2026-07-26 (two React-rule errors on main). The local `gates.sh` hook is not
# a substitute: it runs on one machine, it has failed open once, and it skips
# the build whenever a dev server holds :3000.
#
# Deliberately no secrets: none of these three steps touch the network or the
# database. The runtime half (curl every route, Vitest over the server
# actions) is Tier 2 and lands with auth/M1 — see docs/BACKLOG.md.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # These three steps take ~80 seconds together, so 10 minutes is pure
    # headroom. It exists because the default is SIX HOURS: on 2026-07-29 a
    # hosted runner died after every step had already passed, and the run sat
    # there for 46 minutes before GitHub gave up and emailed a failure for work
    # that had succeeded. This does not prevent that flake — nothing here can —
    # it just stops one from burning 46 minutes of wall-clock and Actions
    # budget, and makes a genuine hang obvious in ten minutes instead of
    # looking like a slow build.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 LTS, which bundles npm 11 — the major that WROTE
          # package-lock.json. On Node 22 (npm 10) `npm ci` refuses the lock
          # outright ("Missing: @swc/helpers@0.5.23"), because npm 10 and 11
          # resolve next-intl's @swc/core peer range differently. Locally
          # `npm ci` is clean under npm 11. If this step starts failing on the
          # lock again, check the npm major before touching dependencies.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
